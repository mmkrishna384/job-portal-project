services:
  - type: web
    name: job-portal-mern
    env: node
    rootDir: backend
    buildCommand: "cd ../frontend && npm install && npm run build && cd ../backend && npm install"
    startCommand: "node server.js"
    envVars:
      - key: PORT
        value: 8000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
